name: Codex P74 Toolbox Patch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P74 toolbox patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = """"""
          Path('codex-p74-toolbox.diff').write_bytes(base64.b64decode(data))
          PY
          git apply --index codex-p74-toolbox.diff
          git rm --ignore-unmatch .github/workflows/codex-p74-toolbox-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: connect P74 tableware tool metadata"
          git push
