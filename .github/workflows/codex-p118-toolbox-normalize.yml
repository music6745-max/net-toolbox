name: Codex P118 Toolbox Normalize

on:
  push:
    paths:
      - ".codex-triggers/p118-toolbox-normalize.txt"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize P118 line endings
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/lib/kaigoSupplementalTools.ts';
          const text = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(path, text.replace(/\r\n/g, '\n'));
          NODE

          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add src/lib/kaigoSupplementalTools.ts
          git rm -f .github/workflows/codex-p118-toolbox-normalize.yml .codex-triggers/p118-toolbox-normalize.txt
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Normalize P118 toolbox metadata line endings"
            git push
          else
            echo "No staged changes"
          fi
