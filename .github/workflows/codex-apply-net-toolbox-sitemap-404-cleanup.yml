name: Codex apply net-toolbox sitemap 404 cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-apply-net-toolbox-sitemap-404-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify expected base
        run: |
          test "$(git rev-parse HEAD)" = "f26613b6cb71dfbf7fbde316c3dd15ba280e67e1"

      - name: Apply deterministic cleanup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function replaceExact(file, before, after) {
            const p = path.join(process.cwd(), file);
            const input = fs.readFileSync(p, 'utf8');
            if (!input.includes(before)) {
              throw new Error(`${file}: expected text not found`);
            }
            fs.writeFileSync(p, input.replace(before, after));
          }

          replaceExact(
            'src/components/AdSenseUnit.tsx',
            '  const resolvedSlot = rawSlot && rawSlot !== "0000000000" ? rawSlot : undefined;\n',
            '  const resolvedSlot = rawSlot && !/^0{10}$/.test(rawSlot) ? rawSlot : undefined;\n'
          );

          const incompleteTools = `  { slug: "slug-generator", name: "スラッグ生成", description: "URL用スラッグを自動生成。", icon: "🔗", category: "開発ツール" },\n  { slug: "qr-bulk", name: "QRコード一括生成", description: "複数のQRコードを一度に生成。", icon: "📱", category: "画像・メディア" },\n  { slug: "password-list", name: "パスワード一括生成", description: "複数のパスワードを一度に生成。", icon: "🔐", category: "セキュリティ" },\n  { slug: "aspect-resizer", name: "アスペクト比リサイズ計算", description: "目標比率に合わせたサイズを計算。", icon: "📏", category: "デザイン" },\n  { slug: "presentation-timer", name: "プレゼンタイマー", description: "プレゼンの残り時間を大画面表示。", icon: "🎤", category: "日常ツール" },\n  { slug: "date-formatter", name: "日付フォーマット", description: "日付を10種類の形式で表示。", icon: "📅", category: "日常ツール" },\n  { slug: "lorem-jp", name: "日本語ダミーテキスト（名文）", description: "名作文学からサンプル文を生成。", icon: "📚", category: "テキスト" },\n  { slug: "cidr-calculator", name: "CIDRサブネット計算", description: "IPサブネットの範囲・ホスト数を計算。", icon: "🌐", category: "開発ツール" },\n  { slug: "interview-timer", name: "面接タイマー", description: "面接の時間配分をステージ別に管理。", icon: "🤝", category: "日常ツール" },\n`;
          replaceExact('src/lib/tools.ts', incompleteTools, '');

          replaceExact(
            'src/app/tools/number-to-kanji/page.tsx',
            '  "十": 10, "百": 100, "千": 1000, "万": 10000, "億": 100000000, "兆": 1000000000000,\n',
            '  "十": 10, "百": 100, "千": 1000, "万": 10000, "億": 10 ** 8, "兆": 10 ** 12,\n'
          );
          replaceExact(
            'src/app/tools/number-to-kanji/page.tsx',
            'const EXAMPLES = [1, 10, 100, 1000, 10000, 100000, 1000000, 100000000, 1000000000000];\n',
            'const EXAMPLES = [1, 10, 100, 1000, 10000, 100000, 1000000, 100000000, 10 ** 12];\n'
          );

          const needles = [
            'slug: "slug-generator"',
            'slug: "qr-bulk"',
            'slug: "password-list"',
            'slug: "aspect-resizer"',
            'slug: "presentation-timer"',
            'slug: "date-formatter"',
            'slug: "lorem-jp"',
            'slug: "cidr-calculator"',
            'slug: "interview-timer"',
            '0000000000',
          ];
          const hits = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else if (ent.isFile()) {
                const s = fs.readFileSync(p, 'utf8');
                for (const needle of needles) {
                  if (s.includes(needle)) hits.push(`${p}: ${needle}`);
                }
              }
            }
          }
          walk('src');
          if (hits.length) throw new Error(`Residual source hits:\n${hits.join('\n')}`);
          NODE

      - name: Validate build and sitemap
        run: |
          npm ci
          npx tsc --noEmit --pretty false
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const sitemap = fs.readFileSync('.next/server/app/sitemap.xml.body', 'utf8');
          const blocked = [
            '/tools/qr-bulk',
            '/tools/slug-generator',
            '/tools/password-list',
            '/tools/aspect-resizer',
            '/tools/presentation-timer',
            '/tools/lorem-jp',
            '/tools/cidr-calculator',
            '/tools/interview-timer',
            '/tools/date-formatter',
            '0000000000',
          ];
          const hits = blocked.filter((item) => sitemap.includes(item));
          if (hits.length) throw new Error(`Residual sitemap hits: ${hits.join(', ')}`);
          console.log(`sitemap url count ${(sitemap.match(/<url>/g) || []).length}`);
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "codex-connector-sync"
          git config user.email "codex-connector-sync@users.noreply.github.com"
          git add src/components/AdSenseUnit.tsx src/lib/tools.ts src/app/tools/number-to-kanji/page.tsx
          git diff --cached --check
          git commit -m "sync: remove incomplete tool sitemap entries"
          git push origin HEAD:master
