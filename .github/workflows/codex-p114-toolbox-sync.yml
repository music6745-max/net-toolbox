name: Codex P114 toolbox sync

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p114-toolbox-sync.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P114 toolbox index entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const toolsPath = 'src/lib/kaigoSupplementalTools.ts';
          let source = fs.readFileSync(toolsPath, 'utf8');
          if (!source.includes('kaigo-parent-favorite-food-snacks-drinks-memo')) {
            const snippet = [
              '  {',
              '    slug: "kaigo-parent-favorite-food-snacks-drinks-memo",',
              '    name: "高齢親の好きな食べ物・お菓子・飲み物メモメーカー",',
              '    description:',
              '      "親が会話で話していた食べ物、お菓子、飲み物の好みを、食事判断や購入判断とは分けて家族内の控えとして整理します。",',
              '    icon: "F",',
              '    category: "日常メモ",',
              '  },',
            ].join('\n');
            source = source.replace(
              /export const kaigoSupplementalTools: Tool\[\] = \[\r?\n/,
              (match) => match + snippet + '\n',
            );
            fs.writeFileSync(toolsPath, source);
          }

          fs.rmSync('.github/workflows/codex-p114-toolbox-sync.yml', { force: true });
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No P114 toolbox changes to commit"
          else
            git commit -m "chore: sync P114 supplemental tool index"
            git push
          fi
