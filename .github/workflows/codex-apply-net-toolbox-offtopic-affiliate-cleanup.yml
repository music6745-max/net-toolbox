name: Codex Apply Offtopic Affiliate Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/codex-apply-net-toolbox-offtopic-affiliate-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and verify tree
        run: |
          set -euo pipefail
          expected_base="736d37ae7c8fd1d3f228be50405fd75b69e29ca9"
          expected_tree="c62a7d56913d549cdf6fa76a0a0a91d19eff5c3c"
          actual_base="$(git rev-parse HEAD^)"
          if [ "$actual_base" != "$expected_base" ]; then
            echo "Unexpected workflow parent: $actual_base"
            exit 1
          fi
          git apply --whitespace=nowarn <<'PATCH'
          diff --git a/src/app/guide/online-counseling-comparison/page.tsx b/src/app/guide/online-counseling-comparison/page.tsx
          index bef578d..955d667 100644
          --- a/src/app/guide/online-counseling-comparison/page.tsx
          +++ b/src/app/guide/online-counseling-comparison/page.tsx
          @@ -2,7 +2,6 @@ import type { Metadata } from "next";
           import Link from "next/link";
           import { siteConfig } from "@/lib/tools";
           import { BreadcrumbJsonLd, FAQJsonLd, ArticleJsonLd } from "@/components/JsonLd";
          -import { ComparisonTableCTA } from "@/components/ComparisonTableCTA";
           
           export const metadata: Metadata = {
             title: "【2026年最新】オンラインカウンセリング比較おすすめ5選｜料金・特徴を徹底解説",
          @@ -138,33 +137,6 @@ export default function OnlineCounselingComparisonPage() {
                   </div>
                 </section>
           
          -      <section className="mb-10">
          -        <h2 className="text-xl font-bold mb-4">安心の通信環境を整えるVPN</h2>
          -        <ComparisonTableCTA
          -          services={[
          -            {
          -              name: "MillenVPN",
          -              url: "https://px.a8.net/svt/ejp?a8mat=4B1DXI+41V7ZM+3JTE+HV7V6",
          -              highlight: "国産で日本語サポート充実",
          -              price: "月額制",
          -              badge: "国産",
          -            },
          -            {
          -              name: "NordVPN",
          -              url: "https://px.a8.net/svt/ejp?a8mat=4B1DXI+3U4L4I+3YFI+60OXD",
          -              highlight: "世界最大手・高セキュリティ",
          -              price: "月額制",
          -            },
          -            {
          -              name: "ExpressVPN",
          -              url: "https://px.a8.net/svt/ejp?a8mat=4B1DXI+3WIBJM+5JSS+5YRHE",
          -              highlight: "業界最速クラスの通信速度",
          -              price: "月額制",
          -            },
          -          ]}
          -        />
          -      </section>
          -
                 <section className="mb-10">
                   <h2 className="text-lg font-bold mb-4">関連ガイド</h2>
                   <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          diff --git a/src/app/guide/streaming-comparison/page.tsx b/src/app/guide/streaming-comparison/page.tsx
          index bb5fcff..f347327 100644
          --- a/src/app/guide/streaming-comparison/page.tsx
          +++ b/src/app/guide/streaming-comparison/page.tsx
          @@ -864,16 +864,14 @@ export default function StreamingComparisonPage() {
                     海外から日本の動画配信を観たい方へ
                   </h2>
                   <p className="text-sm text-slate-700 dark:text-slate-200 mb-3">
          -          Netflix・U-NEXT・Hulu などの日本の動画サービスは、海外からアクセスすると地域制限で視聴できないことがあります。動画視聴に特化した「Glocal VPN」なら、海外赴任・出張・旅行先からでも日本の動画コンテンツをスマートに楽しめます。
          +          Netflix・U-NEXT・Hulu などの日本の動画サービスは、海外からアクセスすると地域制限で視聴できないことがあります。VPNの利用可否や速度、対応地域はサービスごとに異なるため、動画視聴の前に専用の比較ガイドで確認しておきましょう。
                   </p>
          -        <a
          -          href="https://px.a8.net/svt/ejp?a8mat=4B1DXI+3YW1YQ+50C8+5YJRM"
          -          target="_blank"
          -          rel="noopener noreferrer nofollow sponsored"
          +        <Link
          +          href="/guide/vpn-comparison"
                     className="inline-block bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-full text-sm font-medium transition-colors"
                   >
          -          Glocal VPN公式サイトを見る
          -        </a>
          +          VPN比較ガイドを見る
          +        </Link>
                 </section>
           
                 {/* Related Tool CTA */}
          PATCH
          rm -f .github/workflows/codex-apply-net-toolbox-offtopic-affiliate-cleanup.yml
          git add -A
          if git grep -n "px.a8.net" -- src/app/guide/online-counseling-comparison/page.tsx src/app/guide/streaming-comparison/page.tsx; then
            echo "Target pages still contain A8"
            exit 1
          fi
          if git grep -n "ComparisonTableCTA" -- src/app/guide/online-counseling-comparison/page.tsx src/app/guide/streaming-comparison/page.tsx; then
            echo "Target pages still contain ComparisonTableCTA"
            exit 1
          fi
          if git grep -n "Glocal VPN" -- src/app/guide/streaming-comparison/page.tsx; then
            echo "Streaming page still contains Glocal VPN"
            exit 1
          fi
          actual_tree="$(git write-tree)"
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "Tree mismatch: $actual_tree"
            git diff --cached --stat
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "sync: reduce off topic affiliate ctas"
          git push origin HEAD:master
