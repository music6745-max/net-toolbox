name: Codex Trigger P52 Toolbox Patch

on:
  push:
    branches: [master]
    paths:
      - ".github/codex-p52-toolbox-trigger.txt"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract and apply stored patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          awk '/^[[:space:]]*PATCH$/{flag=!flag; next} flag {gsub(/^[[:space:]]+/, ""); print}' .github/workflows/codex-apply-p52-toolbox-20260531.yml | tr -d '[:space:]' > /tmp/codex.patch.b64
          base64 -d /tmp/codex.patch.b64 > /tmp/codex.patch
          git apply --index /tmp/codex.patch
          git rm --quiet --ignore-unmatch \
            .github/workflows/codex-apply-p52-toolbox-20260531.yml \
            .github/workflows/codex-trigger-p52-toolbox-20260531.yml \
            .github/codex-p52-toolbox-trigger.txt
          git add -A
          git diff --cached --stat
          git commit -m "feat: add P52 family history tool"
          git push origin HEAD:master
