name: Codex P89 Toolbox Patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-p89-toolbox-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply P89 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p89.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/p89.patch.gz.b64 | gzip -d > /tmp/p89.patch
          git apply --whitespace=nowarn /tmp/p89.patch
          rm -f .github/workflows/codex-p89-toolbox-patch.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/tools/kaigo-parent-home-family-old-toys-dolls-memo/page.tsx src/lib/kaigoSupplementalTools.ts .github/workflows/codex-p89-toolbox-patch.yml
          git commit -m "feat: add P89 old toys memo tool"
          git push
