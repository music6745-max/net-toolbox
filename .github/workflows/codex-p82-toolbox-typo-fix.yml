name: Codex P82 toolbox wording fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-p82-toolbox-typo-fix.yml

permissions:
  contents: write

jobs:
  fix-wording:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct P82 wording and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
from pathlib import Path
path = Path('src/app/tools/kaigo-parent-home-family-entrance-footwear-memo/page.tsx')
text = path.read_text(encoding='utf-8')
text = text.replace('玄関まりの物', '玄関まわりの物')
path.write_text(text, encoding='utf-8')
PY
          git add src/app/tools/kaigo-parent-home-family-entrance-footwear-memo/page.tsx
          git rm .github/workflows/codex-p82-toolbox-typo-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: correct P82 entrance wording"
          git push
