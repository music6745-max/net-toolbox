name: Codex P82 toolbox patch trigger

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-p82-toolbox.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply previously embedded Codex patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/codex-p82-toolbox.yml > /tmp/previous-workflow.yml
          awk "/<<'PATCH_B64'/{flag=1; next} /^[[:space:]]*PATCH_B64[[:space:]]*$/{flag=0} flag {gsub(/^[[:space:]]+/, \"\"); print}" /tmp/previous-workflow.yml > /tmp/codex-p82.patch.b64
          test -s /tmp/codex-p82.patch.b64
          base64 -d /tmp/codex-p82.patch.b64 > /tmp/codex-p82.patch
          git apply --index /tmp/codex-p82.patch
          git rm .github/workflows/codex-p82-toolbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add P82 entrance footwear tool"
          git push
