name: Codex P56 Toolbox Patch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/codex-p56-phone-visitor.yml
      - .github/codex-p56-phone-visitor.patch.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P56 patch
        run: |
          base64 -d .github/codex-p56-phone-visitor.patch.b64 > /tmp/codex-p56.patch
          git apply --binary --whitespace=nowarn /tmp/codex-p56.patch
          rm .github/codex-p56-phone-visitor.patch.b64 .github/workflows/codex-p56-phone-visitor.yml
          git status --short
      - name: Commit P56 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add P56 phone visitor memo tool"
          git push
