name: Apply P66 toolbox source

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-p66-toolbox.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replay previous P66 toolbox apply script
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/apply-p66-toolbox.yml |
            awk 'found { sub(/^          /, ""); print } /        run: \|/ { found=1 }' > /tmp/apply-p66-toolbox.sh
          bash /tmp/apply-p66-toolbox.sh
