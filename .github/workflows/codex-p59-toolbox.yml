name: Codex P59 Toolbox Patch
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/codex-p59-toolbox.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply P59 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          base64 -d > /tmp/p59-toolbox.patch <<'PATCH_B64'

PATCH_B64
          git apply --whitespace=fix /tmp/p59-toolbox.patch
          rm -f .github/workflows/codex-p59-toolbox.yml
          git add 'src/app/tools/kaigo-parent-window-curtain-screen-size-memo/page.tsx' 'src/lib/tools.ts'
          git add -u .github/workflows/codex-p59-toolbox.yml
          git commit -m "feat: add P59 window curtain screen tool"
          git push origin HEAD:master
