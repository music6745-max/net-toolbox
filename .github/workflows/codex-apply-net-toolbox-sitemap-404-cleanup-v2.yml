name: Codex apply net-toolbox sitemap 404 cleanup v2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-apply-net-toolbox-sitemap-404-cleanup-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply deterministic cleanup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function writeChanged(file, updater) {
            const p = path.join(process.cwd(), file);
            const before = fs.readFileSync(p, 'utf8');
            const after = updater(before);
            if (after === before) throw new Error(`${file}: no change made`);
            fs.writeFileSync(p, after);
          }

          writeChanged('src/components/AdSenseUnit.tsx', (input) => {
            const before = '  const resolvedSlot = rawSlot && rawSlot !== "0000000000" ? rawSlot : undefined;\n';
            const after = '  const resolvedSlot = rawSlot && !/^0{10}$/.test(rawSlot) ? rawSlot : undefined;\n';
            if (!input.includes(before)) throw new Error('AdSenseUnit expected slot guard not found');
            return input.replace(before, after);
          });

          writeChanged('src/lib/tools.ts', (input) => {
            const slugs = [
              'slug-generator',
              'qr-bulk',
              'password-list',
              'aspect-resizer',
              'presentation-timer',
              'date-formatter',
              'lorem-jp',
              'cidr-calculator',
              'interview-timer',
            ];
            const lines = input.split('\n');
            const filtered = lines.filter((line) => !slugs.some((slug) => line.includes(`slug: "${slug}"`)));
            if (lines.length - filtered.length !== slugs.length) {
              throw new Error(`Expected to remove ${slugs.length} incomplete tool rows, removed ${lines.length - filtered.length}`);
            }
            return filtered.join('\n');
          });

          writeChanged('src/app/tools/number-to-kanji/page.tsx', (input) => {
            let output = input.replace(
              '10000, "億": 100000000, "兆": 1000000000000,',
              '10000, "億": 10 ** 8, "兆": 10 ** 12,'
            );
            output = output.replace(
              '1000000, 100000000, 1000000000000];',
              '1000000, 100000000, 10 ** 12];'
            );
            if (output === input) throw new Error('number-to-kanji numeric cleanup not applied');
            return output;
          });

          const needles = [
            'slug: "slug-generator"',
            'slug: "qr-bulk"',
            'slug: "password-list"',
            'slug: "aspect-resizer"',
            'slug: "presentation-timer"',
            'slug: "date-formatter"',
            'slug: "lorem-jp"',
            'slug: "cidr-calculator"',
            'slug: "interview-timer"',
            '0000000000',
          ];
          const hits = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else if (ent.isFile()) {
                const s = fs.readFileSync(p, 'utf8');
                for (const needle of needles) {
                  if (s.includes(needle)) hits.push(`${p}: ${needle}`);
                }
              }
            }
          }
          walk('src');
          if (hits.length) throw new Error(`Residual source hits:\n${hits.join('\n')}`);
          NODE

      - name: Validate build and sitemap
        run: |
          npm ci
          npx tsc --noEmit --pretty false
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const sitemap = fs.readFileSync('.next/server/app/sitemap.xml.body', 'utf8');
          const blocked = [
            '/tools/qr-bulk',
            '/tools/slug-generator',
            '/tools/password-list',
            '/tools/aspect-resizer',
            '/tools/presentation-timer',
            '/tools/lorem-jp',
            '/tools/cidr-calculator',
            '/tools/interview-timer',
            '/tools/date-formatter',
            '0000000000',
          ];
          const hits = blocked.filter((item) => sitemap.includes(item));
          if (hits.length) throw new Error(`Residual sitemap hits: ${hits.join(', ')}`);
          console.log(`sitemap url count ${(sitemap.match(/<url>/g) || []).length}`);
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "codex-connector-sync"
          git config user.email "codex-connector-sync@users.noreply.github.com"
          git add src/components/AdSenseUnit.tsx src/lib/tools.ts src/app/tools/number-to-kanji/page.tsx
          git diff --cached --check
          git commit -m "sync: remove incomplete tool sitemap entries"
          git push origin HEAD:master
