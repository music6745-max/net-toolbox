name: codex-p64-toolbox-trigger

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p64-toolbox-trigger.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stored P64 patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/cat > \/tmp\/p64-toolbox\.patch <<'"'"'PATCH'"'"'/{flag=1; next} /^PATCH$/{flag=0} flag' .github/workflows/codex-p64-toolbox.yml > /tmp/p64-toolbox.patch
          test -s /tmp/p64-toolbox.patch
          git apply /tmp/p64-toolbox.patch
          rm -f .github/workflows/codex-p64-toolbox.yml .github/workflows/codex-p64-toolbox-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/tools/kaigo-parent-speech-habit-phrases-memo/page.tsx src/lib/kaigoSupplementalTools.ts .github/workflows/codex-p64-toolbox.yml .github/workflows/codex-p64-toolbox-trigger.yml
          git commit -m "feat: connect P64 speech phrase tool"
          git push
