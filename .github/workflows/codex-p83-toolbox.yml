# trigger 2026-06-02T03:11:00+09:00
name: Codex P83 Toolbox Patch

on:
  push:
    branches:
      - master

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply P83 toolbox changes
        shell: python
        run: |
          from pathlib import Path

          tools = Path("src/lib/kaigoSupplementalTools.ts")
          text = tools.read_text(encoding="utf-8")
          if 'slug: "kaigo-parent-home-family-small-box-container-memo"' not in text:
              marker = "export const kaigoSupplementalTools: Tool[] = [\n"
              block = '''  {
    slug: "kaigo-parent-home-family-small-box-container-memo",
    name: "高齢親の家の小箱・入れ物まわりメモメーカー",
    description:
      "茶筒、菓子缶、小箱、小さな入れ物など、親の家で家族が長年見てきた小物入れの呼び方、置かれていた場所、親が話してくれたことを、処分や価値判断ではなく家族内の記録として整理します。",
    icon: "B",
    category: "日常ツール",
  },
'''
              if marker not in text:
                  raise SystemExit("tool index marker not found")
              tools.write_text(text.replace(marker, marker + block), encoding="utf-8")
      - name: Commit P83 toolbox changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-automation"
          git config user.email "actions@github.com"
          git rm .github/workflows/codex-p83-toolbox.yml
          git add src/lib/kaigoSupplementalTools.ts
          git commit -m "feat: add P83 small box memo tool index"
          git push
