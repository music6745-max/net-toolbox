name: Codex P57 Toolbox Patch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/codex-p57-memorial-schedule.yml
      - .github/codex-p57-memorial-schedule.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P57 patch
        run: |
          base64 -d .github/codex-p57-memorial-schedule.patch.gz.b64 | gzip -d > /tmp/codex-p57.patch
          git apply --binary --whitespace=nowarn /tmp/codex-p57.patch
          rm .github/codex-p57-memorial-schedule.patch.gz.b64 .github/workflows/codex-p57-memorial-schedule.yml
          git status --short
      - name: Commit P57 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add P57 memorial schedule tool"
          git push
