name: Codex P111 Toolbox Patch

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/codex-p111-toolbox.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply P111 patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/codex-p111.patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          sed -i 's/^          //' /tmp/codex-p111.patch.b64
          base64 -d /tmp/codex-p111.patch.b64 > /tmp/codex-p111.patch
          git apply --binary /tmp/codex-p111.patch
          rm -f .github/workflows/codex-p111-toolbox.yml
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add -A src/app/tools/kaigo-parent-reading-newspaper-magazine-memo/page.tsx src/lib/kaigoSupplementalTools.ts .github/workflows/codex-p111-toolbox.yml
          git commit -m "feat: add P111 reading magazine memo tool"
          git push
