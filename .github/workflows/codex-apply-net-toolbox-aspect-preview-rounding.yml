name: Codex apply net-toolbox aspect preview rounding

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-apply-net-toolbox-aspect-preview-rounding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply deterministic cleanup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/app/tools/aspect-ratio-list/page.tsx';
          let input = fs.readFileSync(file, 'utf8');
          const helperAnchor = '];\n\nexport default function AspectRatioListPage() {';
          if (!input.includes(helperAnchor)) throw new Error('helper anchor not found');
          input = input.replace(helperAnchor, '];\n\nconst formatPreviewPx = (value: number) => `${Math.round(value * 100) / 100}px`;\n\nexport default function AspectRatioListPage() {');
          input = input.replace('                    width: `${Math.min(56, 56 * parseFloat(r.decimal))}px`,\n', '                    width: formatPreviewPx(Math.min(56, 56 * parseFloat(r.decimal))),\n');
          input = input.replace('                    height: `${Math.min(36, 36 / parseFloat(r.decimal))}px`,\n', '                    height: formatPreviewPx(Math.min(36, 36 / parseFloat(r.decimal))),\n');
          if (input.includes('width: `${Math.min(56, 56 * parseFloat(r.decimal))}px`')) throw new Error('width expression still present');
          if (input.includes('height: `${Math.min(36, 36 / parseFloat(r.decimal))}px`')) throw new Error('height expression still present');
          fs.writeFileSync(file, input);
          NODE

      - name: Validate build and generated HTML
        run: |
          npm ci
          npx tsc --noEmit --pretty false
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('.next/server/app/tools/aspect-ratio-list.html', 'utf8');
          if (html.includes('0000000000')) throw new Error('aspect-ratio-list HTML still contains ten-zero sequence');
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "codex-connector-sync"
          git config user.email "codex-connector-sync@users.noreply.github.com"
          git add src/app/tools/aspect-ratio-list/page.tsx
          git diff --cached --check
          git commit -m "sync: round aspect ratio preview styles"
          git push origin HEAD:master
