name: Codex P110 Toolbox Patch

on:
  push:
    branches: [master]
    paths:
      - ".github/codex-p110-toolbox.patch"
      - ".github/workflows/codex-p110-toolbox-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch and commit
        shell: bash
        run: |
          set -euo pipefail
          PATCH=".github/codex-p110-toolbox.patch"
          WORKFLOW=".github/workflows/codex-p110-toolbox-apply.yml"
          if [ ! -f "$PATCH" ]; then
            echo "Patch file not present; waiting for trigger commit."
            exit 0
          fi
          git apply --whitespace=nowarn --ignore-space-change --ignore-whitespace "$PATCH"
          rm -f "$PATCH" "$WORKFLOW"
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add P110 tv radio memo tool"
          git push origin HEAD:master
