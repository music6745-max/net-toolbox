name: Codex Apply AdSense Placeholder Slot Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/codex-apply-net-toolbox-adsense-placeholder-slot-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic replacements and verify tree
        run: |
          set -euo pipefail
          expected_base="367374acb7bad669d0a7920070c522daa186f948"
          expected_tree="efd9477016acee2a9d24272f0a7047d9b95d063e"
          actual_base="$(git rev-parse HEAD^)"
          if [ "$actual_base" != "$expected_base" ]; then
            echo "Unexpected workflow parent: $actual_base"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'src/app/guide/credit-card-comparison/page.tsx',
            'src/app/guide/electric-company-comparison/page.tsx',
            'src/app/guide/gas-company-comparison/page.tsx',
            'src/app/guide/hikari-fiber-comparison/page.tsx',
            'src/app/guide/sim-comparison/page.tsx',
          ];
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replace('<AdSenseUnit adSlot="0000000000" adFormat="auto" />', '<AdSenseUnit adFormat="auto" />');
            if (after === before) throw new Error(`No placeholder slot replacement in ${file}`);
            fs.writeFileSync(file, after, 'utf8');
          }
          const component = 'src/components/AdSenseUnit.tsx';
          let text = fs.readFileSync(component, 'utf8');
          const replacements = [
            ['/** AdSense data-ad-slot ID. Pass "0000000000" as a placeholder until real slots are issued. */', '/** AdSense data-ad-slot ID. Leave unset until real slots are issued. */'],
            [' * Display is gated by NEXT_PUBLIC_ADSENSE_ENABLED. When the env var is unset\n * or not "true", a dark-mode-friendly placeholder is rendered (or nothing in\n * production). After AdSense approval, set NEXT_PUBLIC_ADSENSE_ENABLED=true\n * and replace placeholder slot IDs.', ' * Display is gated by NEXT_PUBLIC_ADSENSE_ENABLED and a real ad slot. When\n * either is missing, a dark-mode-friendly placeholder is rendered in\n * development and nothing is rendered in production.'],
            ['  const resolvedSlot = adSlot ?? slot;\n  const resolvedFormat: AdFormat = adFormat ?? format ?? "auto";\n  const enabled = process.env.NEXT_PUBLIC_ADSENSE_ENABLED === "true";', '  const rawSlot = adSlot ?? slot;\n  const resolvedSlot = rawSlot && rawSlot !== "0000000000" ? rawSlot : undefined;\n  const resolvedFormat: AdFormat = adFormat ?? format ?? "auto";\n  const enabled = process.env.NEXT_PUBLIC_ADSENSE_ENABLED === "true";\n  const shouldRenderAd = enabled && Boolean(resolvedSlot);'],
            ['    if (!enabled) return;', '    if (!shouldRenderAd) return;'],
            ['  }, [enabled]);', '  }, [shouldRenderAd]);'],
            ['  if (!enabled) {', '  if (!shouldRenderAd) {'],
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`Component replacement missing: ${from}`);
            text = text.replace(from, to);
          }
          fs.writeFileSync(component, text, 'utf8');
          NODE
          rm -f .github/workflows/codex-apply-net-toolbox-adsense-placeholder-slot-cleanup.yml
          git add -A
          if git grep -n -E 'adSlot="0000000000"|slot="0000000000"' -- src; then
            echo "Placeholder AdSense slot props remain"
            exit 1
          fi
          actual_tree="$(git write-tree)"
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "Tree mismatch: $actual_tree"
            git diff --cached --stat
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "sync: hide placeholder adsense slots"
          git push origin HEAD:master
