name: Codex sync net toolbox A8 cleanup

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      PATCH_SHA256: "1195e5ceac204c011632695b01bb9b21bc74f7dd078f9026afc759a4b817ac85"
      PATCH_GZ_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compressed patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/codex-sync.patch
          echo "$PATCH_SHA256  /tmp/codex-sync.patch" | sha256sum -c -
          git apply --check /tmp/codex-sync.patch
          git apply /tmp/codex-sync.patch
          git rm --quiet --ignore-unmatch .github/workflows/codex-sync-net-toolbox-a8-cleanup.yml
          git diff --check
          git status --short
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add -A
          git commit -m "sync: net toolbox a8 cta cleanup"
          git push
