name: Codex P72 toolbox trigger

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-p72-toolbox.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Execute previous embedded patch
        shell: bash
        run: |
          git show HEAD~1:.github/workflows/codex-p72-toolbox.yml > /tmp/codex-prev.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/codex-prev.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in text[start:end].splitlines()
          )
          exec(compile(code, 'codex-prev-workflow', 'exec'))
          PY
      - name: Commit P72 toolbox changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/kaigoSupplementalTools.ts src/app/tools/kaigo-parent-home-family-sitting-place-memo/page.tsx .github/workflows/codex-p72-toolbox.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add P72 sitting place tool"
          git push
