name: Codex Apply Net Toolbox Legacy Shared A8 Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/codex-apply-net-toolbox-legacy-shared-a8-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic cleanup and verify tree
        run: |
          set -euo pipefail
          expected_base="7fd59aa00369dd8746209b16476c4d7e7921702e"
          expected_tree="412416ce98433b8f7c5c621d05e618481862e475"
          actual_base="$(git rev-parse HEAD^)"
          if [ "$actual_base" != "$expected_base" ]; then
            echo "Unexpected workflow parent: $actual_base"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const root = path.join(process.cwd(), 'src/app/guide');
          const risky = [
            '4B1DXI+4XF71U+35XE+609HU',
            '4B1DXI+1UOKJ6+3SPO+9FDI8Y',
            '4B1DXI+4W8BUA+4JGQ+60WN6',
          ];
          const whitelist = new Set([
            'accountant-cloud-comparison',
            'accounting-software-comparison',
            'tax-software-comparison',
            'tax-accountant-comparison',
            'tax-accountant-referral-comparison',
            'invoice-system-comparison',
            'small-business-software',
            'crypto-tax-comparison',
            'dapps-wallet-comparison',
          ]);
          function findBlockEnd(text, start) {
            const end = text.indexOf('/>', start);
            return end === -1 ? -1 : end + 2;
          }
          function removalRanges(text) {
            const ranges = [];
            let pos = 0;
            while (true) {
              const start = text.indexOf('<ComparisonTableCTA', pos);
              if (start === -1) break;
              const blockEnd = findBlockEnd(text, start);
              if (blockEnd === -1) break;
              const block = text.slice(start, blockEnd);
              if (risky.some((code) => block.includes(code))) {
                const sectionStart = text.lastIndexOf('<section', start);
                const priorSectionEnd = text.lastIndexOf('</section>', start);
                if (sectionStart !== -1 && sectionStart > priorSectionEnd) {
                  const sectionEndToken = text.indexOf('</section>', blockEnd);
                  if (sectionEndToken !== -1) {
                    let removeStart = sectionStart;
                    while (removeStart > 0 && (text[removeStart - 1] === ' ' || text[removeStart - 1] === '\t')) removeStart--;
                    if (removeStart > 0 && text[removeStart - 1] === '\n') removeStart--;
                    ranges.push([removeStart, sectionEndToken + '</section>'.length]);
                  } else {
                    ranges.push([start, blockEnd]);
                  }
                } else {
                  ranges.push([start, blockEnd]);
                }
              }
              pos = blockEnd;
            }
            return ranges;
          }
          for (const slug of fs.readdirSync(root)) {
            if (whitelist.has(slug)) continue;
            const file = path.join(root, slug, 'page.tsx');
            if (!fs.existsSync(file)) continue;
            const before = fs.readFileSync(file, 'utf8');
            const ranges = removalRanges(before);
            if (!ranges.length) continue;
            let after = before;
            for (const [start, end] of ranges.sort((a, b) => b[0] - a[0])) {
              after = after.slice(0, start) + after.slice(end);
            }
            if (!after.includes('<ComparisonTableCTA')) {
              after = after.replace(/^import \{ ComparisonTableCTA \} from "@\/components\/ComparisonTableCTA";\r?\n/m, '');
            }
            if (after !== before) fs.writeFileSync(file, after, 'utf8');
          }
          const replacements = new Map([
            ['src/app/guide/amazon-prime-vs-rakuten/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+1UOKJ6+3SPO+9FDI8Y', '/guide/credit-card-comparison'],
            ]],
            ['src/app/guide/paypay-vs-rakutenpay/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+1UOKJ6+3SPO+9FDI8Y', '/guide/credit-card-comparison'],
            ]],
            ['src/app/guide/credit-card-platinum-comparison/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+1UOKJ6+3SPO+9FDI8Y', '/guide/credit-card-comparison'],
            ]],
            ['src/app/guide/credit-card-comparison/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+1UOKJ6+3SPO+9FDI8Y', 'https://www.rakuten-card.co.jp/'],
            ]],
            ['src/app/guide/business-credit-card-comparison-2026/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+1UOKJ6+3SPO+9FDI8Y', 'https://www.freee.co.jp/card/corporate/'],
            ]],
            ['src/app/guide/freelance-startup-bundle-2026/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+1UOKJ6+3SPO+9FDI8Y', '/guide/accounting-software-comparison'],
            ]],
            ['src/app/guide/side-business-tools/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+1UOKJ6+3SPO+9FDI8Y', '/guide/accounting-software-comparison'],
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+4XF71U+35XE+609HU', '/guide/accounting-software-comparison'],
            ]],
            ['src/app/guide/web-tools-for-work/page.tsx', [
              ['https://px.a8.net/svt/ejp?a8mat=4B1DXI+4XF71U+35XE+609HU', '/guide/accounting-software-comparison'],
            ]],
          ]);
          for (const [file, pairs] of replacements) {
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            for (const [from, to] of pairs) text = text.split(from).join(to);
            if (text !== before) fs.writeFileSync(file, text, 'utf8');
          }
          const codePattern = '4B1DXI\\+4XF71U\\+35XE\\+609HU|4B1DXI\\+1UOKJ6\\+3SPO\\+9FDI8Y|4B1DXI\\+4W8BUA\\+4JGQ\\+60WN6';
          const grep = execSync(`git grep -n -E "${codePattern}" -- src/app/guide || true`, { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean)
            .filter((line) => !/(accountant-cloud-comparison|accounting-software-comparison|tax-software-comparison|tax-accountant-comparison|tax-accountant-referral-comparison|invoice-system-comparison|small-business-software|crypto-tax-comparison|dapps-wallet-comparison)/.test(line));
          if (grep.length) throw new Error(`Residual non-whitelisted shared A8 codes:\n${grep.join('\n')}`);
          const stale = [];
          for (const slug of fs.readdirSync(root)) {
            const file = path.join(root, slug, 'page.tsx');
            if (!fs.existsSync(file)) continue;
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes('import { ComparisonTableCTA }') && !text.includes('<ComparisonTableCTA')) stale.push(slug);
          }
          if (stale.length) throw new Error(`Stale ComparisonTableCTA imports: ${stale.join(', ')}`);
          NODE
          rm -f .github/workflows/codex-apply-net-toolbox-legacy-shared-a8-cleanup.yml
          git add -A
          actual_tree="$(git write-tree)"
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "Tree mismatch: $actual_tree"
            git diff --cached --stat
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "sync: remove shared legacy a8 ctas"
          git push origin HEAD:master
