name: Codex P112 Toolbox Run

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'trigger P112 toolbox runner now')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply staged P112 patch and clean up
        shell: bash
        run: |
          set -euo pipefail
          awk 'BEGIN{flag=0} /^H4sIA/{flag=1} /^PATCH_B64$/{flag=0} flag{print}' .github/workflows/codex-p112-toolbox.yml > /tmp/codex-p112-toolbox.patch.gz.b64
          test -s /tmp/codex-p112-toolbox.patch.gz.b64
          base64 -d /tmp/codex-p112-toolbox.patch.gz.b64 | gunzip > /tmp/codex-p112-toolbox.patch
          git apply --binary /tmp/codex-p112-toolbox.patch
          rm -f .github/workflows/codex-p112-toolbox.yml .github/workflows/codex-p112-toolbox-run.yml .github/codex-p112-toolbox-trigger.txt
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add -A src/app/tools/kaigo-parent-favorite-music-songs-memo/page.tsx src/lib/kaigoSupplementalTools.ts .github/workflows/codex-p112-toolbox.yml .github/workflows/codex-p112-toolbox-run.yml .github/codex-p112-toolbox-trigger.txt
          git diff --cached --check
          git commit -m "feat: add P112 favorite music memo tool"
          git push origin HEAD:master
