name: P86 normalize toolbox source

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/p86-normalize-toolbox.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'music6745-max/net-toolbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize line endings and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/kaigoSupplementalTools.ts")
          data = path.read_bytes()
          path.write_bytes(data.replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          Path(".github/workflows/p86-normalize-toolbox.yml").unlink(missing_ok=True)
          PY
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/kaigoSupplementalTools.ts .github/workflows/p86-normalize-toolbox.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: normalize P86 tool source"
            git push origin HEAD:master
          fi
