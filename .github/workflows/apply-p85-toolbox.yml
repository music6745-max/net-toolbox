name: Apply P85 Toolbox Patch

on:
  push:
    paths:
      - ".github/workflows/apply-p85-toolbox.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P85 toolbox patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base64 -d > /tmp/p85.patch <<'PATCH_B64'

PATCH_B64
          git apply /tmp/p85.patch
          rm -f .github/workflows/apply-p85-toolbox.yml
          git add src/app/tools/kaigo-parent-home-family-stationery-writing-items-memo/page.tsx src/lib/kaigoSupplementalTools.ts .github/workflows/apply-p85-toolbox.yml
          git commit -m "feat: add P85 stationery tool"
          git push
