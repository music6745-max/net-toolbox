name: Codex apply net toolbox source sync

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          payload_file=".github/codex-sync-net-toolbox-a8-cleanup.patch.br.b64"
          test -f "$payload_file"
          patch_sha="$(awk -F= '/^PATCH_SHA256=/{print $2; exit}' "$payload_file")"
          test -n "$patch_sha"
          awk '/^PATCH_BR_B64_BEGIN$/{flag=1;next}/^PATCH_BR_B64_END$/{flag=0}flag' "$payload_file" | tr -d '\r\n' > /tmp/codex-sync.patch.br.b64
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const zlib = require('zlib');
          const payload = fs.readFileSync('/tmp/codex-sync.patch.br.b64', 'utf8').trim();
          const patch = zlib.brotliDecompressSync(Buffer.from(payload, 'base64'));
          fs.writeFileSync('/tmp/codex-sync.patch', patch);
          const actual = crypto.createHash('sha256').update(patch).digest('hex');
          const expected = process.env.PATCH_SHA;
          if (actual !== expected) {
            console.error(`sha mismatch: ${actual} !== ${expected}`);
            process.exit(1);
          }
          NODE
        env:
          PATCH_SHA: e6e60c7299052dbb76e54308788fdd9dae396e801f9646b8286b3a82d3267694
      - name: Commit synced source
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check /tmp/codex-sync.patch
          git apply --unidiff-zero /tmp/codex-sync.patch
          git rm --quiet --ignore-unmatch .github/codex-sync-net-toolbox-a8-cleanup.patch.br.b64
          git rm --quiet --ignore-unmatch .github/workflows/codex-apply-net-toolbox-source-sync.yml
          git diff --check
          git status --short
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add -A
          git commit -m "sync: net toolbox a8 cta cleanup"
          git push
