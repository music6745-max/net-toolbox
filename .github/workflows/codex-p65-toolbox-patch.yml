name: Codex P65 toolbox patch
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p65-toolbox-patch.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified P65 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p65_toolbox.patch.tgz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/p65_toolbox.patch.tgz.b64 > /tmp/p65_toolbox.patch.tgz
          tar -xzf /tmp/p65_toolbox.patch.tgz -C /tmp
          git apply --whitespace=nowarn /tmp/p65_toolbox.patch
          rm .github/workflows/codex-p65-toolbox-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/app/tools/kaigo-parent-cherished-item-background-memo/page.tsx src/lib/kaigoSupplementalTools.ts .github/workflows/codex-p65-toolbox-patch.yml
          git commit -m "feat: add P65 cherished item kaigo tool"
          git push
