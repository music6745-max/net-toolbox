name: Apply P116 toolbox patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/p116-toolbox-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          cat > /tmp/p116-toolbox.patch.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/p116-toolbox.patch.b64 > /tmp/p116-toolbox.patch
          git apply --check /tmp/p116-toolbox.patch
          git apply /tmp/p116-toolbox.patch
          git rm .github/workflows/p116-toolbox-apply.yml
          git add src/app/tools/kaigo-parent-annual-events-seasonal-prep-memo/page.tsx src/lib/kaigoSupplementalTools.ts
          git commit -m "Add P116 annual events tool"
          git push origin HEAD:master
