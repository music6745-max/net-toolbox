name: Codex P79 toolbox patch retry

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p79-toolbox.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2
      - name: Apply P79 patch from previous payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess

          previous = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/codex-p79-toolbox.yml"],
              text=True,
          )
          match = re.search(r'patch_b64 = """\n(.*?)\n\s+"""', previous, re.S)
          if not match:
              raise SystemExit("patch payload not found")
          payload = "".join(match.group(1).split())
          Path("codex-p79-toolbox.patch").write_bytes(base64.b64decode(payload))
          PY
          git apply --index --whitespace=nowarn codex-p79-toolbox.patch
          rm codex-p79-toolbox.patch
          rm .github/workflows/codex-p79-toolbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "feat: add P79 doors screens memo tool"
          git push origin HEAD:master
