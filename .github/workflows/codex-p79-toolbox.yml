name: Codex P79 toolbox patch

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p79-toolbox.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply P79 toolbox patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          patch_b64 = """

          """
          Path("codex-p79-toolbox.patch").write_bytes(base64.b64decode(patch_b64))
          PY
          git apply --index --whitespace=nowarn codex-p79-toolbox.patch
          rm codex-p79-toolbox.patch
          rm .github/workflows/codex-p79-toolbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "feat: add P79 doors screens memo tool"
          git push origin HEAD:master
